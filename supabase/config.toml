project_id = "scugmxahflsjabglodyv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/onboarding"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# FOS-14 — la vérification d'e-mail était désactivée. Deux conséquences :
#   1. « utilisateur authentifié » désignait le public d'Internet, ce qui rendait
#      exploitables à distance tous les défauts d'autorisation des fonctions edge ;
#   2. accept-invite valide une invitation en comparant inv.email à user.email —
#      une adresse jamais vérifiée. Un lien d'invitation qui fuite valait alors
#      entrée dans le workspace.
enable_confirmations = true
secure_password_change = true

# ── Vérification du JWT à la passerelle ──────────────────────────────────────
#
# FOS-16 — l'ancienne consigne était : « All Edge Functions deployed with
# --no-verify-jwt per user request », et 54 fonctions portaient l'exception.
# C'était la cause commune de la plupart des failles trouvées à l'audit de
# septembre 2026 : sans filet à la passerelle, chaque oubli d'autorisation dans
# une fonction devenait directement exploitable depuis Internet.
#
# LE MALENTENDU QUI A COÛTÉ CHER
# `verify_jwt = true` n'exige pas une session utilisateur : il exige un JWT
# Supabase VALIDE — et la clé anon en est un. Le widget public, le SDK
# analytics et le copilote d'onboarding envoient tous cette clé
# (public/widget.js:72 : `apikey` + `Authorization: Bearer <anon>`). Ils
# continuent donc de fonctionner avec la vérification active. L'exception
# n'était nécessaire que pour les appelants qui n'ont AUCUN JWT Supabase.
#
# La valeur par défaut est désormais `true`. Chaque exception ci-dessous nomme
# l'appelant et le mécanisme d'authentification qui remplace le JWT. Une
# exception sans cette justification ne doit pas être ajoutée.

# ── Webhooks tiers : signés, pas de JWT Supabase ─────────────────────────────

# Stripe signe en HMAC sur le corps brut ; vérifié par verifyStripeSignature
# (_shared/billing-stripe.ts:182), fenêtre de 5 min et comparaison à temps
# constant.
[functions.stripe-webhook]
verify_jwt = false

# Slack : Events API signés en HMAC (v0:{ts}:{body}) + callback OAuth en GET,
# que le navigateur suit sans en-tête. Vérifié dans la fonction.
[functions.slack-gateway]
verify_jwt = false

# Microsoft Teams : l'appelant présente un JWT Bot Framework, pas un JWT
# Supabase. Vérifié contre le JWKS de login.botframework.com.
[functions.teams-gateway]
verify_jwt = false

# Reçoit les webhooks des automatisations avec une clé d'API FounderOS
# (`Authorization: Bearer fos_…`), qui n'est pas un JWT.
[functions.automation-receiver]
verify_jwt = false

# ── Callbacks OAuth : redirection navigateur, aucun en-tête ──────────────────

[functions.mcp-oauth]
verify_jwt = false

[functions.composio-connect]
verify_jwt = false

# ── Runners externes : X-Runner-Token, jamais de JWT ─────────────────────────
# Le jeton est comparé à son empreinte SHA-256 en base (ops_settings.
# runner_token_hash) ou au jeton de plateforme, à temps constant.

[functions.ops-runner-poll]
verify_jwt = false

[functions.test-runner-poll]
verify_jwt = false

[functions.security-scan-poll]
verify_jwt = false

# ── WebSocket : le navigateur ne peut pas poser d'en-tête au handshake ───────
# Le JWT voyage dans la query string et la fonction le vérifie elle-même
# (deepgram-stream/index.ts:26).
[functions.deepgram-stream]
verify_jwt = false

# Telegram, Discord et WhatsApp : chacun signe ses appels à sa façon, vérifiée
# par la fonction elle-même — aucun n'envoie de JWT Supabase.
[functions.messaging-gateway]
verify_jwt = false
