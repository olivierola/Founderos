# Webhook Stripe : l'appelant est Stripe, pas un navigateur — aucun JWT
# Supabase. L'authentification se fait sur la signature HMAC de la requête
# (FOUNDEROS_STRIPE_WEBHOOK_SECRET), vérifiée dans la fonction.
[functions.stripe-webhook]
verify_jwt = false

[functions.automation-receiver]
verify_jwt = false

# Activation Engine + embeddable widget — public surfaces. The widget is loaded
# via a plain <script> tag (no auth header), and the activation endpoints are
# identified by the agent public_key, like the other rag-* public functions.
[functions.rag-widget]
verify_jwt = false

[functions.rag-activation-tick]
verify_jwt = false

[functions.rag-activation-feedback]
verify_jwt = false

# The three endpoints the embedded widget actually talks to. rag-chat serves both
# the widget (public_key, anonymous) and the builder playground (JWT); it checks
# the Authorization header itself on the authenticated branch, so gating it at
# the gateway would only break the public one.
[functions.rag-agent-public-config]
verify_jwt = false

[functions.rag-chat]
verify_jwt = false

[functions.rag-onboarding-orchestrate]
verify_jwt = false

# The external Ops Runner authenticates with X-Runner-Token (hashed against
# ops_settings.runner_token_hash) — it has no Supabase JWT.
[functions.ops-runner-poll]
verify_jwt = false

# E2E testing: the orchestrator verifies the user session manually; the runner
# poll authenticates with X-Runner-Token (no JWT), like ops-runner-poll.
[functions.test-run-orchestrate]
verify_jwt = false

[functions.test-runner-poll]
verify_jwt = false

# Armada: scan a GitHub repo and generate an E2E suite (manual user-session check).
[functions.armada-generate-tests]
verify_jwt = false

# Connector actions: agents call CRM/HR APIs server-side (service role or member).
[functions.connector-action]
verify_jwt = false

# Project inbox: post a channel message + dispatch @mentioned agents.
[functions.project-inbox-post]
verify_jwt = false

# Slack gateway: OAuth callback + Events API webhook. Public (Slack sends no
# Supabase JWT); the function does its own auth (Slack request-signature HMAC).
[functions.slack-gateway]
verify_jwt = false

# Teams Bot Framework webhook: the caller sends a Bot Framework JWT (not a
# Supabase one); teams-gateway verifies it itself against the Bot Framework JWKS.
[functions.teams-gateway]
verify_jwt = false

# Simulations (MiroFish-inspired): single endpoint dispatching by `action`
# (prepare / claim / round / complete / chat).
[functions.simulation-prepare]
verify_jwt = false

# Security scanning: passive checks inline + active scans queued (consent-gated).
[functions.security-scan]
verify_jwt = false

# Security scan runner endpoint (X-Runner-Token, no JWT).
[functions.security-scan-poll]
verify_jwt = false

# PostHog import + connector test re-validation (manual user-session checks).
[functions.sync-posthog]
verify_jwt = false

[functions.test-connection]
