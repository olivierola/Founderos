# Le serveur MCP du cluster SDB (bac à sable : OpenShift + Argo CD), sur le modèle de NPR.
#   helm upgrade --install mcp-sdb MCP/deploy/helm/mcp-server -n ai-mcp -f MCP/deploy/values/cluster-sdb.yaml
servers: [openshift, argocd]
cluster: sdb
image:
  repository: quay.interne.exemple/ai-platform/mcp-server
  tag: "0.2.0"
route:
  host: mcp.apps-int.sdb.interne.exemple
auth:
  founderosUrl: https://founderos-api.apps-int.hub.interne.exemple
  roles: [ai-ops-reader, ai-ops-operator]
approval:
  jwksConfigMap: approval-jwks
rbac:
  write:
    enabled: true
    clusterRole: ai-operator
secretMounts:
  - { name: argocd, secretName: mcp-argocd }
config:
  openshift:
    namespaces: [app-a-sdb, bac-a-sable]
    readCredential: { type: k8s-token, serviceAccount: mcp-sdb-reader }
    writeCredential: { type: k8s-token, serviceAccount: mcp-sdb-operator }
  argocd:
    url: https://openshift-gitops-server.openshift-gitops.svc
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    token: { type: file, path: /etc/mcp-secrets/argocd/token }
    projects: [team-a, sandbox]
