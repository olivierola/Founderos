# helm upgrade --install mcp-observability MCP/deploy/helm/mcp-server -n ai-mcp -f MCP/deploy/values/observability-hub.yaml
server: observability
cluster: hub
image:
  repository: quay.interne.exemple/ai-platform/mcp-observability
  tag: "0.1.0"
route:
  host: mcp-observability.apps-int.hub.interne.exemple
approval:
  jwksUrl: https://founderos.apps-int.ips.interne.exemple/functions/v1/approval-jwks
auth:
  # Jeton tournant (défaut du chart) : graine dans le Secret mcp-token-seed (npm run token -- seed),
  # chaque nouveau jeton livré à FounderOS. Flux ai-mcp (Hub) → FounderOS en 443 (section 5.5).
  founderosUrl: https://founderos-api.apps-int.ips.interne.exemple
vault:
  # Le Vault du Hub : chaque cluster a le sien.
  addr: https://vault.hub.interne.exemple:8200
config:
  clusters: [sdb, npr, prd, ips]
  observatorium:
    url: https://rbac-query-proxy.open-cluster-management-observability.svc:8443
    token: { type: kv, path: mcp/hub/observability/observatorium, key: token }
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  loki:
    url: https://lokistack-gateway-http.openshift-logging.svc:8080/api/logs/v1/application
    token: { type: kv, path: mcp/hub/observability/loki, key: token }
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  apps:
    app-a: { namespace: app-a-prd, cluster: prd }
    app-a-int: { namespace: app-a-int, cluster: npr }
  alertmanager:
    url: https://alertmanager-operated.open-cluster-management-observability.svc:9095
    token: { type: kv, path: mcp/hub/observability/alertmanager, key: token }
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  grafana:
    url: https://grafana.apps-int.hub.interne.exemple
    token: { type: kv, path: mcp/hub/observability/grafana, key: token }
  databases:
    orders-pxc: { engine: mysql, selector: 'namespace="db-orders"' }
