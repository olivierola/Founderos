# Le serveur MCP du Hub, où tourne aussi FounderOS : observabilité, flotte ACM,
# ressources du Hub, Argo CD.
#   helm upgrade --install mcp-hub MCP/deploy/helm/mcp-server -n ai-mcp -f MCP/deploy/values/cluster-hub.yaml
# Nom mcp-hub, comptes mcp-hub-reader et mcp-hub-operator.
servers: [observability, fleet, openshift, argocd]
cluster: hub
image:
  repository: quay.interne.exemple/ai-platform/mcp-server
  tag: "0.2.0"
route:
  host: mcp.apps-int.hub.interne.exemple
auth:
  # FounderOS est sur le même cluster : la livraison du jeton ne sort pas du Hub.
  founderosUrl: https://founderos-api.apps-int.hub.interne.exemple
  roles: [ai-ops-reader, ai-ops-operator]
approval:
  # Approbation exigée pour deployment_restart, deployment_scale et app_sync sur le Hub
  # (FounderOS y tourne), et pour alert_silence_create vers PRD (cluster CIBLE).
  jwksConfigMap: approval-jwks
rbac:
  write:
    enabled: true
    clusterRole: ai-operator
  # Le module flotte lit les politiques ACM de tous les namespaces.
  clusterWide: [ai-acm-policy-reader]
secretMounts:
  - { name: observatorium, secretName: mcp-observatorium }
  - { name: loki, secretName: mcp-loki }
  - { name: alertmanager, secretName: mcp-alertmanager }
  - { name: grafana, secretName: mcp-grafana }
  - { name: acm-search, secretName: mcp-acm-search }
  - { name: argocd, secretName: mcp-argocd }
config:
  observability:
    clusters: [sdb, npr, prd, ips]
    observatorium:
      url: https://rbac-query-proxy.open-cluster-management-observability.svc:8443
      token: { type: file, path: /etc/mcp-secrets/observatorium/token }
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    loki:
      url: https://lokistack-gateway-http.openshift-logging.svc:8080/api/logs/v1/application
      token: { type: file, path: /etc/mcp-secrets/loki/token }
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    apps:
      app-a: { namespace: app-a-prd, cluster: prd }
      app-a-int: { namespace: app-a-int, cluster: npr }
    alertmanager:
      url: https://alertmanager-operated.open-cluster-management-observability.svc:9095
      token: { type: file, path: /etc/mcp-secrets/alertmanager/token }
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    grafana:
      url: https://grafana.apps-int.hub.interne.exemple
      token: { type: file, path: /etc/mcp-secrets/grafana/token }
    databases:
      orders-pxc: { engine: mysql, selector: 'namespace="db-orders"' }
  fleet:
    clusters: [sdb, npr, prd, ips]
    search:
      url: https://search-search-api.open-cluster-management.svc:4010/searchapi/graphql
      token: { type: file, path: /etc/mcp-secrets/acm-search/token }
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    hubApi:
      url: https://kubernetes.default.svc
      token: { type: k8s-token, serviceAccount: mcp-hub-reader }
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kinds: [Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet, Service, Route, Node, Namespace, PersistentVolumeClaim, Application]
  openshift:
    namespaces: [founderos, ai-mcp, open-cluster-management-observability]
    readCredential: { type: k8s-token, serviceAccount: mcp-hub-reader }
    writeCredential: { type: k8s-token, serviceAccount: mcp-hub-operator }
  argocd:
    url: https://openshift-gitops-server.openshift-gitops.svc
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    token: { type: file, path: /etc/mcp-secrets/argocd/token }
    projects: [platform]
