{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcp.name" . }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "mcp.selector" . | nindent 6 }}
  endpoints:
    - { port: mgmt, path: /metrics, interval: 30s }
{{- end }}
