apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp.name" . }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
# Le jeton n'est monté que sous forme projetée (deployment.yaml). Son seul droit :
# demander les jetons courts des comptes dédiés (rbac.yaml).
automountServiceAccountToken: false
