{{- if .Values.route.enabled }}
# Shard d'Ingress Controller interne uniquement ; TLS terminé par le serveur (mTLS).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "mcp.name" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    {{- toYaml .Values.route.shardLabels | nindent 4 }}
spec:
  host: {{ required "route.host est obligatoire" .Values.route.host }}
  to: { kind: Service, name: {{ include "mcp.name" . }} }
  port: { targetPort: https }
  tls: { termination: passthrough, insecureEdgeTerminationPolicy: None }
{{- end }}
