{{- if and .Values.rbac.create .Values.rbac.clusterRoles.create }}
# Les droits auxquels les comptes dédiés sont liés, namespace par namespace.
# Jamais : Secrets, exec, port-forward, suppression. Une seule release par cluster les crée.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-reader
  labels: {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
# SDB et NPR : lecture, redémarrage et mise à l'échelle des déploiements.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-operator
  labels: {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
# PRD : redémarrage et mise à l'échelle d'un déploiement, rien d'autre (toujours sous approbation).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-prd-restarter
  labels: {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
---
# Hub : lecture des politiques ACM de tous les namespaces (module flotte).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-acm-policy-reader
  labels: {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [policy.open-cluster-management.io]
    resources: [policies]
    verbs: [get, list]
{{- end }}
