# Clé du serveur : observability | fleet | openshift | argocd | git | prtg
server: ""
# OU plusieurs modules derrière un seul serveur, un par cluster (recommandé) :
#   servers: [openshift, argocd]  → mcp-<cluster>, audience mcp-<cluster>,
#   config: { openshift: {…}, argocd: {…} }
servers: []
# Cluster qui héberge ce serveur : hub | ips | sdb | npr | prd
cluster: ""

image:
  repository: quay.interne.exemple/ai-platform/mcp-server
  tag: "0.2.0"
  pullPolicy: IfNotPresent

replicas: 2

# Audience attendue dans le jeton d'appel (mode oidc) et dans les jetons
# d'approbation. Vide : mcp-<cluster> (servers) ou mcp-<server>-<cluster>.
audience: ""

# Authentification des appels :
#   rotating (défaut) : jeton d'API tournant. Le serveur le calcule à chaque période
#                    depuis une graine (Secret seedSecret, clé seed, créé à l'installation :
#                    npm run token -- seed) et livre lui-même chaque nouveau jeton à
#                    FounderOS (founderosUrl). Le premier se colle une fois dans FounderOS.
#   token          : jetons d'API fixes (npm run token -- generate), empreintes dans le
#                    Secret tokensSecret (clé tokens.json), relues à chaud ;
#   oidc           : jetons émis par un IdP (échange de jeton, On-Behalf-Of) — voir keycloak.
# Architecture Hub (docs/architecture-hub.md) : rotating, sans IdP côté serveur.
auth:
  mode: rotating
  seedSecret: mcp-token-seed
  # Durée d'un jeton ; l'ancien reste accepté une période de plus.
  period: 24h
  # Rôles du jeton (catalogue) ; les scopes s'en déduisent. En production, les écritures
  # restent soumises à approbation quel que soit le rôle.
  roles: [ai-ops-reader]
  # Où livrer chaque nouveau jeton : le backend de FounderOS, sur le Hub. Flux à ouvrir :
  # ce namespace vers la Route de FounderOS, en HTTPS (docs/architecture-hub.md, flux F4).
  founderosUrl: ""
  # ConfigMap de l'AC de FounderOS (clé ca.crt) ; vide : AC système.
  founderosCaConfigMap: ""
  # Mode token : le Secret des empreintes.
  tokensSecret: mcp-tokens

# Mode oidc seulement. IdP qui émet les jetons d'appel : Keycloak, ou un autre IdP (Entra ID : issuer
# https://login.microsoftonline.com/<tenant>/v2.0, jwksUrl obligatoire). Nom de clé historique.
keycloak:
  issuer: https://keycloak.ips.interne.exemple/realms/platform
  # Durée de vie maximale d'un jeton d'appel, en secondes. Vide : 360. Entra ID
  # sans politique de durée de vie : 5460.
  maxTokenLifetime: ""
  # Optionnel : JWKS joint par une adresse interne.
  jwksUrl: ""
  # Agents (azp) acceptés.
  allowedAgents: [agent-ops-investigator, agent-ops-change]

approval:
  # Jetons d'approbation signés par FounderOS (écritures en PRD et sur le Hub).
  # jwksUrl et jwksConfigMap vides : désactivé.
  issuer: https://founderos-api.apps-int.hub.interne.exemple
  jwksUrl: ""
  # À la place de jwksUrl, pour un cluster qui ne joint pas FounderOS : une
  # ConfigMap (clé jwks.json) copiée depuis GET /functions/v1/approval-jwks.
  jwksConfigMap: ""
  # Audience des jetons d'approbation, si elle diffère de celle des jetons d'appel
  # (Entra ID : l'audience de la connexion côté FounderOS, ex. api://mcp-prd). Vide : la même.
  audience: ""

# Identifiants Kubernetes, sans Vault : deux comptes de service dédiés, liés par
# RoleBinding dans les seuls namespaces autorisés. Le serveur obtient pour chaque
# appel un jeton de 10 minutes par l'API TokenRequest (credential { type: k8s-token }).
#   <nom>-reader    ClusterRole readClusterRole dans chaque namespace
#   <nom>-operator  ClusterRole write.clusterRole, si write.enabled
rbac:
  create: true
  # Namespaces où lier les comptes ; vide : ceux de config.namespaces ou config.openshift.namespaces.
  namespaces: []
  readClusterRole: ai-reader
  write:
    enabled: false
    # ai-operator en SDB et NPR ; ai-prd-restarter en PRD (redémarrage et mise à l'échelle seulement).
    clusterRole: ai-operator
  # Crée les ClusterRoles ai-reader, ai-operator, ai-prd-restarter et ai-acm-policy-reader.
  # Une seule release par cluster doit le faire.
  clusterRoles:
    create: true
  # Liaisons de cluster en plus, pour le compte lecteur (module flotte du Hub) :
  #   - ai-acm-policy-reader
  clusterWide: []

# Identifiants des outils, montés depuis des Secrets existants, sous
# /etc/mcp-secrets/<name>/ (credential { type: file, path: /etc/mcp-secrets/argocd/token }).
#   - { name: argocd, secretName: mcp-argocd }
secretMounts: []

# Garde-fous d'exécution.
limits:
  # Appels par minute et par appelant, et rafale permise.
  ratePerMinute: 120
  burst: 30
  # Tools exécutés en même temps, et durée maximale d'un tool.
  maxConcurrency: 16
  toolTimeout: 30s

vault:
  # En option : identifiants kv et vault-k8s, si l'entreprise a un Vault.
  enabled: false
  addr: ""
  # Rôle de la méthode kubernetes ; vide : le nom du déploiement (mcp-<server> ou mcp-<cluster>).
  role: ""
  # Méthode kubernetes et moteur de secrets Kubernetes de ce Vault ; vides : kubernetes.
  authMount: ""
  kvMount: secret
  k8sSecretsMount: ""
  # ConfigMap qui porte l'AC de Vault (clé ca.crt) ; vide : AC système.
  caConfigMap: ""
  tokenAudience: vault
  tokenExpirationSeconds: 600

tls:
  # Secret kubernetes.io/tls du certificat serveur ; vide : <nom>-tls (cert-manager ci-dessous).
  secretName: ""
  # ConfigMap de l'AC qui signe les certificats clients de FounderOS (clé ca.crt).
  clientCaConfigMap: platform-client-ca
  # CN acceptés pour le certificat client.
  allowedClientCNs: [founderos-ai-platform]

certManager:
  enabled: true
  issuerKind: ClusterIssuer
  issuerName: platform-internal-ca
  duration: 720h
  renewBefore: 168h

route:
  enabled: true
  host: ""
  # Labels du routeSelector de l'Ingress Controller interne.
  shardLabels:
    router-shard: internal

opa:
  enabled: true
  image: quay.interne.exemple/mirror/openpolicyagent/opa:1.21.1-static
  # ConfigMap produite par le dépôt ai-policies : clés ai_tools.rego et catalog.json.
  policyConfigMap: ai-policies

# Configuration propre au serveur (voir MCP/config/examples/).
config: {}

serviceMonitor:
  enabled: true

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }
