# Passerelle d'entreprise FounderOS (G7) sur une machine du réseau interne,
# sans Kubernetes : un conteneur, le lanceur gateway.mjs (relais + serveur MCP).
#
#   cp deploy/gateway/gateway.env.example deploy/gateway/.env    # puis le remplir
#   docker compose -f deploy/gateway/docker-compose.yml up -d
#
# Aucun port publié : le relais ne fait que sortir vers FounderOS, le serveur MCP
# écoute sur la boucle locale du conteneur. Ici, les deux processus partagent le
# conteneur : la séparation des secrets porte sur leurs variables. Sur
# Kubernetes, le chart les sépare aussi sur disque (deux conteneurs d'un pod).

services:
  gateway:
    image: ${GATEWAY_IMAGE:-founderos/gateway:0.1.0}
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_CONFIG_FILE: /etc/mcp/config.json
      # Jeton tournant : la graine (token-cli.js seed) ; chaque nouveau jeton part vers FOUNDEROS_URL.
      MCP_TOKEN_SEED_FILE: /etc/mcp-token-seed/seed
      # Pas d'OPA sur une machine seule : décision locale du catalogue livré.
      # Pour OPA, OPA_URL=http://opa:8181 et un service opa à côté.
      POLICY_ENGINE: ${POLICY_ENGINE:-builtin}
    volumes:
      - ./mcp-config.json:/etc/mcp/config.json:ro
      - ./seed.txt:/etc/mcp-token-seed/seed:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
