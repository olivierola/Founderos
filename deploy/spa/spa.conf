# Règles de la SPA, incluses dans le serveur par défaut de l'image UBI nginx
# (/opt/app-root/etc/nginx.default.d/). Les en-têtes reprennent ceux de
# vercel.json, avec les seules adresses de l'installation (__*__ remplacés au
# démarrage du conteneur, deploy/spa/entrypoint.sh).
#
# nginx : un add_header dans une location remplace TOUS ceux du niveau
# au-dessus. Chaque location porte donc ses en-têtes au complet.

# Politique de contenu en observation d'abord, comme sur vercel.json ; à passer
# en Content-Security-Policy une fois les rapports propres.
set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' __SUPABASE_URL__ __SUPABASE_WS__ __API_URL__; worker-src 'self' blob:; frame-src 'self' blob: https:; base-uri 'self'; form-action 'self'; object-src 'none'";
set $permissions "camera=(self), microphone=(self), geolocation=(), payment=(), interest-cohort=()";
set $hsts "max-age=31536000; includeSubDomains";

# Fichiers fingerprintés par Vite : cache long.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security $hsts always;
  try_files $uri =404;
}

# Le panneau de l'extension navigateur encadre /companion (vercel.json) : seule
# exception au refus d'encadrement. index.html est servi ICI (rewrite … break),
# sans redirection interne qui lui ferait perdre ces en-têtes.
location /companion {
  rewrite ^ /index.html break;
  add_header Content-Security-Policy "frame-ancestors 'self' chrome-extension: moz-extension:" always;
  add_header Content-Security-Policy-Report-Only "$csp; frame-ancestors 'self' chrome-extension: moz-extension:" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security $hsts always;
  add_header Permissions-Policy $permissions always;
  add_header Cache-Control "no-cache" always;
}

# Les adresses de l'installation, écrites au démarrage (entrypoint.sh) : jamais
# en cache, sinon un changement d'adresse ne serait pas vu.
location = /config.js {
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security $hsts always;
  try_files $uri =404;
}

# Toute autre route de l'application rend index.html, jamais mis en cache : un
# déploiement est vu immédiatement. La redirection interne vers /index.html
# revient ici, avec les mêmes en-têtes.
location / {
  try_files $uri $uri/ /index.html;
  add_header Content-Security-Policy-Report-Only "$csp; frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security $hsts always;
  add_header Permissions-Policy $permissions always;
  add_header Cache-Control "no-cache" always;
}
