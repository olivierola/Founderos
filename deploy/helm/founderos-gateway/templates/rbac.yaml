{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gw.fullname" . }}-{{ .Values.rbac.clusterRole }}
  labels: {{- include "gw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gw.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.extraRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gw.fullname" . }}-extra
  labels: {{- include "gw.labels" . | nindent 4 }}
rules: {{- toYaml .Values.rbac.extraRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gw.fullname" . }}-extra
  labels: {{- include "gw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gw.fullname" . }}-extra
subjects:
  - kind: ServiceAccount
    name: {{ include "gw.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
