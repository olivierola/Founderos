{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gw.serviceAccount" . }}
  labels: {{- include "gw.labels" . | nindent 4 }}
# Les jetons ne sont montés que projetés, conteneur par conteneur (deployment.yaml).
automountServiceAccountToken: false
{{- end }}
