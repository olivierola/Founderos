{{- if not .Values.relay.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gw.relaySecret" . }}
  labels: {{- include "gw.labels" . | nindent 4 }}
type: Opaque
stringData:
  RELAY_TOKEN: {{ required "relay.token (ou relay.existingSecret) est requis" .Values.relay.token | quote }}
{{- end }}
