{{- if and (include "gw.mcpEnabled" .) .Values.serviceMonitor.enabled }}
# Les métriques seulement : aucun Service ne publie le port MCP.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gw.fullname" . }}-metrics
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  selector: {{- include "gw.selector" . | nindent 4 }}
  ports:
    - { name: mgmt, port: 9090, targetPort: mgmt }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gw.fullname" . }}
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "gw.selector" . | nindent 6 }}
  endpoints:
    - { port: mgmt, path: /metrics, interval: 30s }
{{- end }}
