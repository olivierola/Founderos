{{- if .Values.networkPolicy.enabled }}
# Aucune entrée, sauf la supervision vers /metrics. Le port MCP n'écoute que sur
# la boucle locale du pod : il n'est pas joignable, même sans cette politique.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gw.fullname" . }}
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gw.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if and (include "gw.mcpEnabled" .) .Values.networkPolicy.metricsFrom }}
  ingress:
    - from: {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports: [{ port: 9090, protocol: TCP }, { port: 8282, protocol: TCP }]
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    # DNS
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # FounderOS, en HTTPS sortant
    - ports:
        - { protocol: TCP, port: 443 }
    {{- range .Values.networkPolicy.egressCidrs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
    {{- end }}
{{- end }}
