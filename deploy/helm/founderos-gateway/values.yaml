# Passerelle d'entreprise FounderOS (G7).
#
# Un pod, deux conteneurs de la même image :
#   - relay : le seul chemin vers FounderOS, en sortie (HTTPS) ; aucune entrée ;
#   - mcp   : les serveurs MCP du cluster, sur 127.0.0.1 seulement. Aucun
#             Service, aucune Route, aucun autre pod ne les joint : seul le
#             relais voisin (même pod, même boucle locale) y accède.
# Chaque conteneur ne monte que ses secrets : le relais ne voit ni Vault ni les
# jetons d'API du serveur MCP ; le serveur MCP ne voit pas le jeton du relais.
#
#   helm upgrade --install founderos-gateway deploy/helm/founderos-gateway -n founderos-gateway --create-namespace \
#     --set founderosUrl=https://<projet>.supabase.co --set relay.existingSecret=founderos-relay \
#     --set mcp.servers='{openshift,argocd}' --set mcp.cluster=prd -f mcp-config.yaml
#
# Dans FounderOS : Serveurs MCP → Ajouter, accès « par le relais » de cette
# passerelle, adresse http://127.0.0.1:8443/mcp, authentification « Jeton d'API ».

image:
  repository: quay.interne.exemple/founderos/gateway
  # Suffixe -k8s : helm et kubectl dans l'image (WITH_K8S_TOOLS=true), pour les
  # opérations « commande » du relais.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Adresse de FounderOS : https://<projet>.supabase.co, ou le backend.
founderosUrl: ""

relay:
  # Jeton du relais (Ressources → Outils internes → Relais). Préférez
  # existingSecret (clé RELAY_TOKEN) en production.
  token: ""
  existingSecret: ""
  # Liste blanche des outils joignables, appliquée ICI. Le serveur MCP de la
  # passerelle (127.0.0.1:<mcp.port>) y est ajouté d'office.
  allowedHosts: ""
  # CLI autorisées pour les opérations « commande » (ex. "helm,kubectl").
  allowedBinaries: ""
  deniedSubcommands: "helm:uninstall,helm:delete,helm:plugin,kubectl:delete,kubectl:exec,kubectl:cp,kubectl:port-forward,kubectl:proxy,kubectl:attach,kubectl:debug"
  concurrency: 4
  # ConfigMap de l'AC interne (clé ca.pem), pour les outils en https.
  caConfigMap: ""
  # Secrets lus par le relais pour les profils « relais » (env:NOM côté FounderOS).
  #   - { name: ARGOCD_TOKEN, secretName: argocd-founderos, secretKey: token }
  secretEnv: []
  # Monte le jeton du compte de service dans le conteneur du relais : seulement
  # pour helm et kubectl (relay.allowedBinaries). Les droits sont ceux de rbac.
  kubernetesAccess: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

mcp:
  # Modules servis : openshift, argocd, observability, fleet, git, prtg. Vide : relais seul.
  servers: []
  # Le cluster servi : hub | ips | sdb | npr | prd.
  cluster: ""
  # Port local (127.0.0.1) du serveur MCP.
  port: 8443
  # Audience attendue ; vide : mcp-<cluster>.
  audience: ""
  auth:
    # rotating (défaut) : jeton tournant. Le serveur le calcule à chaque période depuis
    #         une graine (Secret seedSecret, clé seed) et livre lui-même chaque nouveau
    #         jeton à FounderOS (founderosUrl). La graine et le premier jeton, à l'installation :
    #           node mcp/dist/token-cli.js seed --file seed.txt   (dans l'image, ou npm run token -- seed)
    # token : jetons d'API fixes, empreintes dans le Secret tokensSecret (clé tokens.json),
    #         relues à chaud (token-cli.js generate).
    # oidc  : jetons émis par l'IdP (échange de jeton) — voir oidc.
    mode: rotating
    # Vide : <nom>-token-seed.
    seedSecret: ""
    period: 24h
    roles: [ai-ops-reader]
    # Vide : <nom>-mcp-tokens.
    tokensSecret: ""
  oidc:
    issuer: ""
    jwksUrl: ""
    allowedAgents: []
    maxTokenLifetime: ""
  approval:
    # Jetons d'approbation signés par FounderOS (actions sensibles). jwksUrl ou
    # jwksConfigMap (clé jwks.json, copie de GET /functions/v1/approval-jwks).
    issuer: ""
    jwksUrl: ""
    jwksConfigMap: ""
    audience: ""
  # Configuration des modules (voir MCP/config/examples/). Un module : sa
  # configuration telle quelle ; plusieurs : une clé par module, ex. :
  #   openshift: { namespaces: [app-a-prd], readCredential: { type: file, path: /var/run/secrets/kubernetes.io/serviceaccount/token } }
  #   argocd: { url: https://argocd-server.argocd.svc, token: { type: env, name: ARGOCD_TOKEN }, projects: [team-a] }
  config: {}
  # Identifiants locaux (credential { type: env, name: … }) tirés de Secrets existants.
  secretEnv: []
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

opa:
  # sidecar : OPA dans le pod (127.0.0.1:8181) ; external : opa.url ;
  # builtin : décision locale du catalogue, sans OPA (essai seulement).
  mode: sidecar
  url: ""
  image: openpolicyagent/opa:1.21.1-static
  # ConfigMap du dépôt de politiques (clés ai_tools.rego et catalog.json). Vide :
  # la politique et le catalogue livrés dans l'image de la passerelle.
  policyConfigMap: ""

vault:
  # Sans Vault, les modules s'authentifient avec des identifiants locaux : le jeton
  # du compte de service du pod (credential { type: file }), borné par rbac.
  enabled: false
  addr: ""
  # Rôle de la méthode kubernetes ; vide : le nom de la passerelle.
  role: ""
  authMount: ""
  kvMount: secret
  k8sSecretsMount: ""
  # ConfigMap de l'AC de Vault (clé ca.crt) ; vide : AC système.
  caConfigMap: ""
  tokenAudience: vault
  tokenExpirationSeconds: 600

serviceAccount:
  create: true
  name: ""

# Droits Kubernetes du compte de service : la vraie barrière, sans Vault, pour
# les modules MCP et les commandes du relais.
rbac:
  create: false
  clusterRole: view
  extraRules: []

networkPolicy:
  enabled: true
  # Qui peut lire /metrics (9090) : la supervision. Vide : aucune entrée.
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  metricsFrom: []
  # Destinations internes (CIDR), tous ports : outils, API Kubernetes, Vault.
  # Le DNS et le HTTPS sortant (FounderOS) sont toujours ouverts.
  egressCidrs: []

serviceMonitor:
  enabled: false

replicaCount: 1
nodeSelector: {}
tolerations: []
affinity: {}
