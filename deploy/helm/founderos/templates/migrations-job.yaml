{{- if .Values.migrations.enabled }}
# Les migrations de supabase/migrations (deploy/migrations). Après l'installation
# (le Secret de la base existe alors), avant chaque mise à jour (les nouveaux
# pods trouvent une base à jour). Registre et verrou : relancer ne rejoue rien.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    {{- include "founderos.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "founderos.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      {{- include "founderos.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "founderos.image" (list . .Values.images.migrations) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- with .Values.migrations.baseline }}
          args: ["migrate.mjs", "--baseline", {{ . | quote }}]
          command: ["node"]
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.supabase.existingSecret }}, key: databaseUrl } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
