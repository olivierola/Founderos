apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "founderos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels:
        {{- include "founderos.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "founderos.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "founderos.image" (list . .Values.images.web) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          # Une seule image pour toutes les installations : les adresses au démarrage
          # (deploy/spa/entrypoint.sh écrit /config.js et la politique de contenu).
          env:
            - { name: FOUNDEROS_SUPABASE_URL, value: {{ include "founderos.supabaseUrl" . | quote }} }
            - { name: FOUNDEROS_API_URL, value: {{ include "founderos.backendUrl" . | quote }} }
            - name: FOUNDEROS_SUPABASE_ANON_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.supabase.existingSecret }}, key: anonKey } }
          readinessProbe:
            httpGet: { path: /config.js, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "founderos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 8080, targetPort: http }
