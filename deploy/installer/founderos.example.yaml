# founderos.yaml — tout ce qu'il faut pour installer FounderOS (G5).
#
#   cp deploy/installer/founderos.example.yaml founderos.yaml
#   node deploy/installer/founderos-config.mjs founderos.yaml --out ./install
#
# Les profils prêts à l'emploi sont dans deploy/installer/profiles/.

# Où : kubernetes (Ingress), openshift (Routes) ou vm (docker compose sur une machine).
target: kubernetes

# Les adresses publiques. Sans urls, déduites du domaine :
#   https://founderos.<domain>, https://founderos-api.<domain>, https://founderos-sb.<domain>
domain: acme.fr
# urls:
#   web: https://founderos.acme.fr
#   api: https://founderos-api.acme.fr
#   supabase: https://founderos-sb.acme.fr

supabase:
  # selfhosted : l'installateur prépare les clés d'un Supabase auto-hébergé (compose officiel ou
  # chart de la communauté), dans supabase.env. provided : une instance existante.
  mode: selfhosted
  # Adresse interne pour le backend, si elle diffère de l'adresse publique.
  internalUrl: ""
  # provided seulement (ou SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DATABASE_URL dans l'environnement) :
  # anonKey: …
  # serviceRoleKey: …
  # databaseUrl: postgres://postgres:…@hôte:5432/postgres

# Les administrateurs de l'installation (Administration → Installation).
admins:
  - plateforme-ia@acme.fr

sso:
  # dedicated : une installation pour une entreprise ; shared : plusieurs organisations, domaines vérifiés.
  mode: dedicated

# Durée des sessions de l'Auth. Désactiver quelqu'un dans l'IdP l'empêche d'ouvrir une
# session, pas de garder la sienne : ces bornes la ferment d'elles-mêmes.
sessions:
  timebox: 24h       # au plus
  inactivity: 8h     # sans activité

llm:
  # none : les fournisseurs par défaut ; litellm ou azure : la passerelle de l'entreprise.
  gateway: litellm
  litellm:
    url: http://litellm.ai-gateway.svc:4000/v1
    model: ops-default
    heavyModel: ops-reasoning
  # azure:
  #   url: https://<ressource>.openai.azure.com/openai/deployments/<déploiement>
  #   deployment: gpt-4o
  # La clé n'est jamais écrite ici : exportez LLM_API_KEY avant de lancer l'installateur
  # (ou rangez-la dans Vault, ou ajoutez-la au Secret du backend).

secrets:
  # generate : l'installateur crée les clés (chiffrement, signature, Supabase) ;
  # vault : des ExternalSecret les recopient de Vault ; existing : les Secrets existent déjà.
  source: generate
  # vault:
  #   store: vault           # le ClusterSecretStore d'External Secrets Operator
  #   path: secret/data/founderos
  # existing:
  #   backend: founderos-backend
  #   supabase: founderos-supabase

images:
  registry: ghcr.io/founderos
  tag: "0.1.0"

kubernetes:
  ingressClass: nginx
  tlsSecret: founderos-tls

# openshift:
#   routeLabels: { shard: internal }

# vm:
#   tls: auto        # auto (Let's Encrypt) ou internal (réseau sans Internet)

# Base déjà migrée à la main avant l'installateur : noter jusqu'à cette version sans rejouer.
# migrations:
#   baseline: "0272"
