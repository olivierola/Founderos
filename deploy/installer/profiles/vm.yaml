# Profil machine virtuelle : une machine Linux avec Docker, Supabase par son compose
# officiel sur la même machine, HTTPS par Caddy. Petites équipes, essai.
target: vm
domain: acme.fr
supabase:
  mode: selfhosted
  internalUrl: http://kong:8000
  dbHost: db
admins: [admin@acme.fr]
sso: { mode: dedicated }
llm: { gateway: none }
secrets: { source: generate }
vm: { tls: auto }
