# Profil OpenShift, installation SCIC (docs/openshift-implementation.md) : la même
# installation, décrite par founderos.yaml. Routes sur le shard interne, Supabase
# déjà déployé (section 9), secrets dans le Vault d'IPS (section 11.2), LiteLLM
# vers Azure OpenAI (D1), SSO dédié.
target: openshift
urls:
  web: https://founderos.apps-int.ips.interne.exemple
  api: https://founderos-api.apps-int.ips.interne.exemple
  supabase: https://founderos-sb.apps-int.ips.interne.exemple
supabase:
  mode: provided
  internalUrl: http://kong.founderos-supabase.svc:8000
admins: [plateforme-ia@scic.interne.exemple]
sso: { mode: dedicated }
llm:
  gateway: litellm
  litellm:
    url: http://litellm.ai-gateway.svc:4000/v1
    model: ops-default
    heavyModel: ops-reasoning
    embeddingModel: ops-embeddings
secrets:
  source: vault
  vault: { store: vault-ips, path: secret/data/founderos }
images:
  registry: quay.interne.exemple/ai-platform
  tag: "2026.10.11"
openshift:
  routeLabels: { shard: internal }
