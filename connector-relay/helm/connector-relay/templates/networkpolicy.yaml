{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relay.fullname" . }}
  labels: {{- include "relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "relay.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  # Aucune entrée : le relais ne fait que sortir.
  ingress: []
  egress:
    # DNS
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # FounderOS (HTTPS sortant)
    - ports:
        - { protocol: TCP, port: 443 }
    {{- range .Values.networkPolicy.egressCidrs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
    {{- end }}
{{- end }}
